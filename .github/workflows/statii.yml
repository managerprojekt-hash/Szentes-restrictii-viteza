name: Stații din OpenStreetMap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/statii_osm.py', '.github/workflows/statii.yml']

permissions:
  contents: write

jobs:
  statii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/statii_osm.py
      - name: Salvează
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/statii_osm.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Stațiile din OpenStreetMap"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 10; done; exit 1
