name: Actualizare restricții de viteză

on:
  schedule:
    # la începutul fiecărei decade: zilele 1, 11 și 21, ora 00:10 (ora României), cu o a doua încercare la 08:10;
    # GitHub folosește ora UTC, de aceea rularea pornește la orele UTC posibile (vară/iarnă) și pasul „Ziua” o oprește în rest
    - cron: '10 21,22,5,6 * * *'
  workflow_dispatch:
    inputs:
      arhive:
        description: 'Descarcă și arhivele ZIP (decembrie 2020 – iunie 2025)'
        type: boolean
        default: false
      reconstruire:
        description: 'Reconstruiește datele tuturor decadelor'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/actualizare.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizare
  cancel-in-progress: false

jobs:
  actualizare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Ziua (rulează doar în zilele 1, 11, 21, la 00:10 sau 08:10 ora României)
        id: zi
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> $GITHUB_OUTPUT; exit 0; fi
          D=$(TZ=Europe/Bucharest date +%d); H=$(TZ=Europe/Bucharest date +%H)
          if [[ "$D" =~ ^(01|11|21)$ && "$H" =~ ^(00|08)$ ]]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; echo "Nu este începutul unei decade ($D, ora $H)."; fi

      - uses: actions/checkout@v4
        if: steps.zi.outputs.run == 'true'

      - name: Ramura „arhiva” cu buletinele originale
        if: steps.zi.outputs.run == 'true'
        run: |
          git config --global user.name "restrictii-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin arhiva >/dev/null; then
            git fetch --depth=1 origin arhiva:arhiva
            git worktree add arhiva arhiva
          else
            git worktree add --orphan -b arhiva arhiva
          fi

      - uses: actions/setup-python@v5
        if: steps.zi.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Biblioteci
        if: steps.zi.outputs.run == 'true'
        run: pip install python-docx pdfplumber

      - name: LibreOffice (pentru buletinele vechi .doc din arhive)
        if: ${{ steps.zi.outputs.run == 'true' && inputs.arhive }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer-nogui

      - name: Descarcă buletinele noi de pe cfr.ro
        if: steps.zi.outputs.run == 'true'
        env:
          RAW_DIR: arhiva/raw
          ARCHIVE_DIR: zip_raw
          FETCHED: .fetched
        run: python tools/fetch.py ${{ inputs.arhive && '--archives' || '' }}

      - name: Construiește datele hărții
        if: steps.zi.outputs.run == 'true'
        env:
          RAW_DIR: arhiva/raw
          ARCHIVE_DIR: zip_raw
        run: |
          PERIODS="$(cat .fetched 2>/dev/null || true)" python tools/build.py . ${{ (inputs.reconstruire || github.event_name == 'push') && '--all' || '' }}

      - name: Anexa 19 DRR (restricții de capacitate și manevră)
        if: steps.zi.outputs.run == 'true'
        env:
          DDR_DIR: arhiva/ddr
        run: |
          python tools/ddr_fetch.py || true
          python tools/ddr_build.py ${{ (inputs.reconstruire || github.event_name == 'push') && '--all' || '' }}

      - name: Salvează arhiva și datele
        if: steps.zi.outputs.run == 'true'
        run: |
          cd arhiva
          git add -A
          if ! git diff --cached --quiet; then git commit -q -m "Buletine B.A.R. și Anexa 19 DRR $(date -u +%F)"; git push -q origin arhiva; fi
          cd ..
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "Date restricții $(date -u +%F)"
            for i in 1 2 3; do   # if main moved meanwhile (another commit), put the data commit on top and retry
              git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
              sleep 10
            done
            echo "SCHIMBAT=1" >> $GITHUB_ENV
          fi

      - name: Republică site-ul
        if: ${{ steps.zi.outputs.run == 'true' && env.SCHIMBAT == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
